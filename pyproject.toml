[project]
name = "lambda-rust-benchmark"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3==1.43.111", "httpx==0.28.1", "typer==0.27.3", "loguru==0.7.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "fastapi==0.143.0", "mangum==0.22.0", "pydantic==2.14.0"]
build = ["cargo-lambda==1.9.2", "ziglang==0.14.1"]

[tool.pytest.ini_options]
pythonpath = [".", "backends/python"]
testpaths = ["tests"]
