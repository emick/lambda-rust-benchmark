name: Publish benchmark report
on:
  push:
    branches: [main]
    paths: ['report/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify static report
        run: test -s report/index.html && test -s report/summary.json && test -s report/samples.jsonl.gz
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: report
          include-hidden-files: true
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
