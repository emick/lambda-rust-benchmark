[package]
name = "benchmark-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
lambda_http = "=1.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
garde = { version = "=0.23.0", features = ["derive"] }
aws-config = "=1.12.0"
aws-sdk-dynamodb = "=1.130.0"
aws-sdk-s3 = "=1.152.0"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread"] }
uuid = { version = "=1.28.0", features = ["v4"] }
tower = { version = "=0.5.3", features = ["util"] }
regex = "=1.13.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
